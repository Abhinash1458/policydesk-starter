# PolicyDesk CI/CD — runs on GitHub's free hosted runner (ubuntu-latest).
#
#   smoke (2 tests)  ──►  regression (10 tests)  ──►  deploy (main only, Render deploy hook)
#
# Fails fast: if smoke fails, regression never runs; if regression fails, nothing deploys.
# Lab tests (marker `lab`) are excluded until students remove the marker — see tests/test_pricing.py.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button — useful during the trainer's deployment demo

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  smoke:
    name: Smoke tests (2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run smoke tests
        run: pytest -m smoke -v --junitxml=reports/smoke.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: reports/smoke.xml

  regression:
    name: Regression tests (10)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: pytest -m regression -v --junitxml=reports/regression.xml
      - name: Run everything students have finished (all tests except `lab`)
        run: pytest -m "not lab" -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: reports/regression.xml

  deploy:
    name: Deploy to Render
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK secret not set — tests passed, deploy skipped."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Deploy triggered on Render."
